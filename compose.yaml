services:
  voice:
    image: "${VOICE_IMAGE:?Set VOICE_IMAGE}"
    restart: unless-stopped
    network_mode: host
    command:
      - uvicorn
      - app:app
      - --host
      - 0.0.0.0
      - --port
      - "8011"
      - --ssl-certfile
      - /run/secrets/voice.crt
      - --ssl-keyfile
      - /run/secrets/voice.key
    environment:
      VOICE_BACKEND_URL: "${VOICE_BACKEND_URL:-http://127.0.0.1:8000}"
      VOICE_LIGHTS: "${VOICE_LIGHTS:-}"
      VOICE_DEVICES: "${VOICE_DEVICES:-}"
      VOICE_CLOUD_IDS: "${VOICE_CLOUD_IDS:-}"
      VOICE_CLOUD_DEVICES: "${VOICE_CLOUD_DEVICES:-}"
      OPENAI_API_KEY_FILE: /run/secrets/openai-key
      SMART_HOME_API_TOKEN_FILE: /run/secrets/backend-token
      VOICE_PASSWORD_FILE: /run/secrets/password
    volumes:
      - type: bind
        source: "${VOICE_SECRETS_DIR:?Set VOICE_SECRETS_DIR}"
        target: /run/secrets
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://127.0.0.1:8011/health', context=ssl._create_unverified_context(), timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
